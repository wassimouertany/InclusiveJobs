events {}

http {
    client_max_body_size 20M;

    # Sole CORS owner: neither core-service nor ai-service run CORSMiddleware anymore,
    # since they're never called directly by a browser. Mirrors the former allowlist
    # from backend/main.py's CORSMiddleware.
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
        "http://localhost:5173" $http_origin;
        "http://127.0.0.1:5173" $http_origin;
        "http://localhost:5174" $http_origin;
        "http://127.0.0.1:5174" $http_origin;
    }

    server {
        listen 80;

        location /ai/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://ai-service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://core-service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
